name: Site checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate published site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out site and preservation baselines
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Set up Node for syntax checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Validate pages, translations and preserved content
        run: python3 scripts/validate-site.py

      - name: Check hand-authored JavaScript syntax
        run: |
          for script in studio/*.js; do
            node --check "$script"
          done

      - name: Verify recovered public Markdown
        run: python3 scripts/verify-legacy-source.py

      - name: Verify legacy asset isolation and retired deploy targets
        run: |
          python3 -m unittest discover -s scripts -p test_legacy_asset_guard.py -v
          python3 scripts/check_legacy_assets.py

      - name: Verify reproducible static packaging
        run: |
          python3 scripts/build-site.py --output "$RUNNER_TEMP/site-a" --manifest "$RUNNER_TEMP/site-a.json"
          python3 scripts/build-site.py --output "$RUNNER_TEMP/site-b" --manifest "$RUNNER_TEMP/site-b.json"
          cmp "$RUNNER_TEMP/site-a.json" "$RUNNER_TEMP/site-b.json"

      - name: Install locked browser test dependencies
        run: npm ci --prefix maintenance/browser-tests --ignore-scripts

      - name: Install test Chromium
        working-directory: maintenance/browser-tests
        run: npx --no-install playwright install --with-deps --no-shell chromium

      - name: Check interactions in the packaged site
        env:
          SITE_ROOT: ${{ runner.temp }}/site-a
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/browser-results
        run: npm test --prefix maintenance/browser-tests

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-failure-evidence
          path: ${{ runner.temp }}/browser-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the verified Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/site-a

  deploy:
    name: Deploy verified site
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
