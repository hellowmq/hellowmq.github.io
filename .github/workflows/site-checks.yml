name: Site checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate published site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out site and preservation baselines
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Set up Node for syntax checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Validate pages, translations and preserved content
        run: python3 scripts/validate-site.py

      - name: Check hand-authored JavaScript syntax
        run: |
          for script in studio/*.js; do
            node --check "$script"
          done
